<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Game Shop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #121212;
      color: white;
    }

    header {
      background: #1f1f1f;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      color: #00ffcc;
    }

    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .price {
      color: #00ffcc;
      font-size: 18px;
      margin: 10px 0;
    }

    button {
      padding: 10px;
      border: none;
      background: #00ffcc;
      color: black;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #00ccaa;
    }

    #cart {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #1f1f1f;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>🎮 GAME SHOP</header>

<div class="container" id="shop"></div>

<div id="cart">
  🛒 Giỏ hàng: <span id="total">0</span> VND
</div>

<script>
  const products = [
    {
      name: "Gói VIP Game",
      price: 20000,
      img: "https://via.placeholder.com/200"
    },
    {
      name: "Skin hiếm",
      price: 50000,
      img: "https://via.placeholder.com/200"
    },
    {
      name: "Dịch vụ nâng cấp",
      price: 100000,
      img: "https://via.placeholder.com/200"
    }
  ];

  let total = 0;

  const shop = document.getElementById("shop");

  products.forEach((p) => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <div class="price">${p.price} VND</div>
      <button onclick="buy(${p.price})">Mua</button>
    `;

    shop.appendChild(div);
  });

  function buy(price) {
    total += price;
    document.getElementById("total").innerText = total;
    alert("Đã thêm vào giỏ hàng!");
  }
</script>

</body>
</html>
